<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character · GeezVTT</title>
  <link rel="stylesheet" href="sheet.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #202731; color: #e6ebf1; }
    body { max-width: 40rem; margin: auto; padding: 1rem; }
    h1 { font-size: 1.1rem; }
    nav { display: flex; flex-wrap: wrap; gap: .4rem; }
    button { padding: .4rem; color: inherit; background: #293544; border: 1px solid #61758f; border-radius: .25rem; cursor: pointer; }
    button[aria-pressed="true"] { background: #344f70; border-color: #a2cbff; }
  </style>
</head>
<body>
  <h1 id="sheet-name">Character</h1>
  <nav id="sheet-sections" aria-label="Character sections"></nav>
  <p id="sheet-status" role="status">Loading…</p>
  <main id="sheet-content" class="sheet-content"></main>
  <section id="spell-glossary-panel" class="editor-panel" role="dialog" aria-modal="false" aria-labelledby="spell-glossary-title" hidden>
    <div class="editor-titlebar" tabindex="0" aria-label="Move glossary window. Drag or use arrow keys.">
      <h2 id="spell-glossary-title">Glossary</h2>
      <button class="editor-close" type="button" aria-label="Close glossary">&times;</button>
    </div>
    <div class="editor-body sheet-content">
      <div id="spell-glossary-content"></div>
      <output id="spell-cast-status" aria-live="polite"></output>
      <div id="spell-cast-rolls"></div>
      <output id="spell-roll-result" aria-live="polite"></output>
    </div>
  </section>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/sheet.js"></script>
</body>
</html>
