<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeezVTT · Minigames</title>
  <link rel="stylesheet" href="minigame.css?v=horde12">
</head>
<body>
  <header>
    <a id="minigame-back" href="index.html">Tabletop</a>
    <h1>Zombie Horde</h1>
    <button id="player-sign-in" type="button" aria-haspopup="dialog" aria-controls="player-login">Sign in</button>
    <span id="presence-online"></span>
    <span id="presence-status" role="status"></span>
  </header>
  <dialog id="player-login" aria-labelledby="player-login-title">
    <form id="player-login-form">
      <h2 id="player-login-title">Player sign in</h2>
      <label>Campaign<select id="player-campaign" required><option value="">Choose campaign</option></select></label>
      <label>Character<select id="player-character" required disabled><option value="">Choose PC</option></select></label>
      <button type="submit">Join</button>
      <output id="player-login-status" role="status" aria-live="polite"></output>
    </form>
  </dialog>
  <main>
    <section class="game-card" aria-labelledby="game-title">
      <h2 id="game-title">Zombie Horde</h2>
      <output id="minigame-status" role="status" aria-live="polite">Waiting for a game from the tabletop.</output>
      <canvas id="horde-canvas" role="img" aria-label="Arena. Zombies walk down toward the gate. Move with the arrow keys and type the words you see."></canvas>
      <canvas id="horde-text" aria-hidden="true"></canvas>
      <form id="horde-setup" class="game-controls" hidden>
        <label>Campaign<select id="horde-campaign"></select></label>
        <fieldset id="horde-party"><legend>Who?</legend></fieldset>
        <label>Spd <select id="horde-new-speed" aria-label="Zombie speed"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
        <button id="horde-create" type="submit">Create game</button>
      </form>
      <div id="horde-lobby" class="game-controls" hidden>
        <strong id="minigame-player-name"></strong>
        <label id="horde-speed-label" hidden>Spd <select id="horde-speed" aria-label="Zombie speed"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label>
        <button id="horde-start" type="button" hidden>Start</button>
        <button id="horde-end" type="button" hidden>End game</button>
      </div>
      <p id="horde-hint"></p>
      <form id="minigame-entry" hidden>
        <label>Type a word, then keep moving with the arrow keys<input id="minigame-input" type="text" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" disabled></label>
      </form>
      <ul id="horde-spells" hidden aria-label="Your spells"></ul>
      <div id="horde-results" hidden><output id="horde-summary" role="status"></output></div>
    </section>
  </main>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/player-presence.js"></script>
  <script type="module" src="js/horde-page.js"></script>
</body>
</html>
