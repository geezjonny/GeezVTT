<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeezVTT · Minigames</title>
  <link rel="stylesheet" href="minigame.css">
</head>
<body>
  <header>
    <a id="minigame-back" href="index.html">Tabletop</a>
    <h1>Zombie Typing · DEX</h1>
    <button id="player-sign-in" type="button" aria-haspopup="dialog" aria-controls="player-login">Sign in</button>
    <span id="presence-online"></span>
    <span id="presence-status" role="status"></span>
  </header>
  <dialog id="player-login" aria-labelledby="player-login-title">
    <form id="player-login-form">
      <h2 id="player-login-title">Player sign in</h2>
      <label>Campaign<select id="player-campaign" required><option value="">Choose campaign</option></select></label>
      <label>Character<select id="player-character" required disabled><option value="">Choose PC</option></select></label>
      <button type="submit">Join</button>
      <output id="player-login-status" role="status" aria-live="polite"></output>
    </form>
  </dialog>
  <main>
    <section class="game-card" aria-labelledby="game-title">
      <h2 id="game-title">Survive the wave</h2>
      <output id="minigame-status" role="status" aria-live="polite">Waiting for a game from the tabletop.</output>
      <div id="minigame-session" hidden>
        <div class="game-controls">
          <label>Watching<select id="minigame-player" aria-label="Watch a PC"></select></label>
          <button id="minigame-roll" type="button" hidden>Roll DEX &amp; Play</button>
          <button id="minigame-pause" type="button" aria-pressed="false" hidden>Pause</button>
        </div>
        <output id="minigame-roll-result"></output>
        <output id="minigame-score" role="status" aria-live="polite"></output>
        <svg id="minigame-arena" viewBox="0 0 300 400" role="img" aria-label="Zombies approach from above. Type a zombie's word to defeat it.">
          <defs>
            <g id="typing-zombie" stroke="#17251b" stroke-width="3" stroke-linecap="round">
              <path d="m-8 6-5 18m21-18 5 18M-8-9-22-4m30-5 14 5" stroke="#67865a" stroke-width="8"/>
              <path d="M-9-13h18L12 7h-24Z" fill="#735b53"/>
              <circle cy="-23" r="10" fill="#9cb778"/>
              <path d="M-5-25h1m8 0h1m-9 7h8" stroke="#263626"/>
            </g>
          </defs>
          <path d="M15 340h270" stroke="#b65d60" stroke-width="2" stroke-dasharray="7 5"/>
          <g id="typing-zombies"></g>
          <g transform="translate(150 371)" fill="#9bc8ee" stroke="#385777" stroke-width="3">
            <path d="m-9 0-5 17m23-17 5 17M-9-9-20 1m29-10 11 10M-9-14H9V4H-9Z"/>
            <circle cy="-23" r="9"/>
          </g>
        </svg>
        <form id="minigame-entry" hidden><label>Type a word<input id="minigame-input" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off" disabled></label></form>
      </div>
    </section>
    <aside>
      <section class="game-card" aria-labelledby="team-title">
        <h2 id="team-title">Team</h2>
        <output id="minigame-team" role="status" aria-live="polite"></output>
        <ol id="minigame-results"></ol>
      </section>
      <section class="game-card" aria-labelledby="dice-title">
        <h2 id="dice-title">Shared dice</h2>
        <form id="minigame-dice-form">
          <label>Roll<input id="minigame-dice-expression" value="1d20" maxlength="200" required></label>
          <label>Mode<select id="minigame-dice-mode"><option value="normal">Normal</option><option value="advantage">Advantage</option><option value="disadvantage">Disadvantage</option></select></label>
          <button type="submit">Roll</button>
        </form>
        <ol id="minigame-dice-history" aria-label="Shared dice history" aria-live="polite"></ol>
      </section>
    </aside>
  </main>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/player-presence.js"></script>
  <script type="module" src="js/minigame-page.js"></script>
</body>
</html>
